<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        /* Estilo do Terminal HTTP Melhorado */
        .terminal { background-color: #1e1e1e; color: #d4d4d4; font-family: 'Courier New', Courier, monospace; min-height: 350px; max-height: 600px; overflow-y: auto; }
        .terminal-log { border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 12px; white-space: pre-wrap; word-break: break-all; }
        .method-get { color: #569cd6; font-weight: bold; }
        .method-post { color: #ce9178; font-weight: bold; }
        .status-ok { color: #4CAF50; font-weight: bold; }
        .status-err { color: #f44336; font-weight: bold; }
    </style>
</head>
<body class="container py-5">

<h2 class="mb-4 text-primary">📦 Sistema de Controle de Estoque</h2>

<div id="alertBox"></div>

<div class="row mb-4">
    <!-- Criar Produto -->
    <div class="col-md-5">
        <div class="card p-4 h-100">
            <h4 class="mb-3">Novo Produto</h4>
            <input type="text" id="prodName" class="form-control mb-2" placeholder="Nome (Ex: Teclado)">
            <input type="text" id="prodSku" class="form-control mb-2" placeholder="Código SKU (Ex: TEC-001)">
            <input type="number" id="prodMin" class="form-control mb-3" placeholder="Estoque Mínimo">
            <button class="btn btn-primary w-100" onclick="criarProduto()">Salvar Produto</button>
        </div>
    </div>

    <!-- Movimentar Estoque -->
    <div class="col-md-7">
        <div class="card p-4 h-100 border-start border-4 border-warning">
            <h4 class="mb-3">Registrar Movimentação</h4>
            <div class="row">
                <div class="col-sm-3">
                    <input type="number" id="movProdId" class="form-control mb-2" placeholder="ID Produto">
                </div>
                <div class="col-sm-4">
                    <select id="movType" class="form-select mb-2">
                        <option value="IN">Entrada (IN)</option>
                        <option value="OUT">Saída (OUT)</option>
                    </select>
                </div>
                <div class="col-sm-3">
                    <input type="number" id="movQtd" class="form-control mb-2" placeholder="Qtd">
                </div>
                <div class="col-sm-2">
                    <button class="btn btn-success w-100" onclick="movimentar()">Salvar</button>
                </div>
            </div>
            <small class="text-muted">A regra de negócio bloqueará saídas maiores que o saldo disponível.</small>
        </div>
    </div>
</div>

<!-- Tabela de Produtos -->
<div class="card p-4 mb-4">
    <h4 class="mb-3">Estoque Atual</h4>
    <table class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>SKU</th>
            <th>Saldo Atual</th>
        </tr>
        </thead>
        <tbody id="tabelaProdutos">
        <!-- Dados injetados via JS -->
        </tbody>
    </table>
</div>

<!-- Terminal de Requisições -->
<div class="card p-0 terminal border border-secondary shadow-sm">
    <div class="bg-dark text-light p-2 border-bottom border-secondary d-flex justify-content-between align-items-center">
        <span>>_ HTTP Request Log </span>
        <button class="btn btn-sm btn-outline-light" onclick="document.getElementById('httpConsole').innerHTML = ''">Clear</button>
    </div>
    <div class="p-3" id="httpConsole">
        <div class="text-muted small">Aguardando tráfego de rede...</div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api';

    function showAlert(msg, type='danger') {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show"><strong>Aviso:</strong> ${msg}</div>`;
        setTimeout(() => alertBox.innerHTML = '', 5000);
    }

    // Func log do Terminal
    function logRequest(method, endpoint, reqBody, status, resBody) {
        const consoleDiv = document.getElementById('httpConsole');
        const time = new Date().toLocaleTimeString();
        const methodClass = method === 'GET' ? 'method-get' : 'method-post';
        const statusClass = status >= 200 && status < 300 ? 'status-ok' : 'status-err';

        if(consoleDiv.innerHTML.includes('Aguardando tráfego')) consoleDiv.innerHTML = '';

        let logHtml = `<div class="terminal-log">`;
        logHtml += `<div><span class="text-secondary">[${time}]</span> <span class="${methodClass}">${method}</span> /api/${endpoint}</div>`;

        if (reqBody) {
            logHtml += `<div><span class="text-secondary">Request Body:</span> <span class="text-light">${JSON.stringify(reqBody)}</span></div>`;
        }

        logHtml += `<div><span class="text-secondary">Response Code:</span> <span class="${statusClass}">${status}</span></div>`;

        if (resBody) {
            logHtml += `<div><span class="text-secondary">Response Body:</span> <span style="color: #9cdcfe;">${JSON.stringify(resBody)}</span></div>`;
        }

        logHtml += `</div>`;
        consoleDiv.innerHTML = logHtml + consoleDiv.innerHTML;
    }

    async function carregarProdutos() {
        const res = await fetch(`${API_URL}/products`);
        const data = await res.json();

        logRequest('GET', 'products', null, res.status, data.content || data);

        const tbody = document.getElementById('tabelaProdutos');
        tbody.innerHTML = '';

        if(data.content) {
            data.content.forEach(p => {
                const badgeClass = p.currentStock <= 0 ? 'bg-danger' : 'bg-success';
                tbody.innerHTML += `
                        <tr>
                            <td><strong>${p.id}</strong></td>
                            <td>${p.name}</td>
                            <td><span class="badge bg-secondary">${p.sku}</span></td>
                            <td><span class="badge ${badgeClass} fs-6">${p.currentStock}</span></td>
                        </tr>
                    `;
            });
        }
    }

    async function criarProduto() {
        const payload = {
            name: document.getElementById('prodName').value,
            sku: document.getElementById('prodSku').value,
            minimumStock: document.getElementById('prodMin').value || 0
        };

        const res = await fetch(`${API_URL}/products`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        logRequest('POST', 'products', payload, res.status, data);

        if(res.ok) {
            showAlert('Produto cadastrado com sucesso!', 'success');
            document.getElementById('prodName').value = '';
            document.getElementById('prodSku').value = '';
            carregarProdutos();
        } else {
            showAlert('Erro ao cadastrar produto.');
        }
    }

    async function movimentar() {
        const payload = {
            productId: document.getElementById('movProdId').value,
            type: document.getElementById('movType').value,
            quantity: document.getElementById('movQtd').value,
            reason: "Via Interface Web"
        };

        const res = await fetch(`${API_URL}/movements`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        let data = {};
        try { data = await res.json(); } catch(e) {}

        logRequest('POST', 'movements', payload, res.status, data);

        if(res.status === 422) {
            showAlert(`Operação Bloqueada: ${data.message}`, 'danger');
        } else if (res.ok) {
            showAlert('Movimentação registrada com sucesso!', 'success');
            document.getElementById('movProdId').value = '';
            document.getElementById('movQtd').value = '';
            carregarProdutos();
        } else {
            showAlert('Erro! Verifique os dados e tente novamente.', 'warning');
        }
    }

    window.onload = carregarProdutos;
</script>
</body>
</html>
